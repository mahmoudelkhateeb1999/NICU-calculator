<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced NICU Protocol Calculator</title>
    <style>
        :root {
            --primary-color: #005b96;
            --secondary-color: #b3cde0;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --danger-color: #d9534f;
            --success-color: #27ae60;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 10px;
            margin-top: 0;
        }
        .row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .form-group {
            flex: 1;
            min-width: 200px;
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--primary-color);
            font-size: 14px;
        }
        input[type="number"], input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            transition: all 0.3s;
        }
        input[readonly] {
            background-color: #e9ecef;
            color: #555;
            border-color: #bbb;
            font-weight: bold;
        }
        .std-badge {
            display: inline-block;
            background-color: var(--success-color);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 5px;
            display: none; /* مخفي افتراضياً */
        }
        .amikin-note {
            color: var(--danger-color);
            font-size: 12px;
            font-weight: bold;
            display: none;
            margin-top: 5px;
        }
        .checkbox-group {
            background-color: #fff3cd;
            border-right: 4px solid #ffc107;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .checkbox-group input {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #03396c;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f4f8;
            border-right: 5px solid var(--primary-color);
            border-radius: 6px;
            display: none;
            line-height: 1.8;
        }
        .highlight {
            font-weight: bold;
            color: var(--danger-color);
        }
        .success-text {
            color: var(--success-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>حاسبة البروتوكول المتقدمة (NICU)</h2>
    
    <!-- صف الأعمار -->
    <div class="row">
        <div class="form-group">
            <label>Gestational Age (weeks):</label>
            <input type="number" id="ga" min="22" max="42" placeholder="مثال: 30" oninput="calculatePMA()">
        </div>
        
        <div class="form-group">
            <label>Postnatal Age (days):</label>
            <input type="number" id="pna" min="0" max="90" placeholder="مثال: 10" oninput="calculatePMA()">
        </div>

        <div class="form-group">
            <label>Calculated PMA (weeks):</label>
            <input type="text" id="pma" readonly placeholder="سيحسب تلقائياً">
        </div>
    </div>

    <!-- صف الوزن والدواء -->
    <div class="row">
        <div class="form-group">
            <label>وزن الطفل (كجم):</label>
            <input type="number" id="weight" step="0.01" placeholder="مثال: 1.5">
        </div>

        <div class="form-group">
            <label>اختر الدواء:</label>
            <select id="drug" onchange="updateVialInputs()">
                <option value="unasyn">Unasyn (Ampicillin/Sulbactam)</option>
                <option value="meronem">Meronem (Meropenem)</option>
                <option value="amikin">Amikin (Amikacin)</option>
                <option value="vancomycin">Vancomycin</option>
                <option value="caffeine">Caffeine Citrate</option>
                <option value="calcium">Calcium Gluconate 10%</option>
                <option value="fluconazole">Fluconazole</option>
            </select>
        </div>
    </div>

    <!-- زر التهاب السحايا -->
    <div class="checkbox-group">
        <input type="checkbox" id="meningitisToggle">
        <label for="meningitisToggle" style="margin: 0; color: #856404; font-weight: bold;">
            تفعيل جرعة التهاب السحايا (Anti-meningitic Dose)
        </label>
    </div>

    <!-- صف تفاصيل الفايل -->
    <div class="row" style="background: #f8f9fa; padding: 10px; border-radius: 8px;">
        <div class="form-group">
            <label>تركيز الفايل المتاح (mg): <span id="stdBadgeMg" class="std-badge">تركيز قياسي حسب البروتوكول</span></label>
            <input type="number" id="vial_mg" placeholder="أدخل التركيز">
        </div>

        <div class="form-group">
            <label>حجم الفايل المتاح (ml): <span id="stdBadgeMl" class="std-badge">تركيز قياسي</span></label>
            <input type="number" id="vial_ml" step="0.1" placeholder="أدخل الحجم">
            <div id="amikinNote" class="amikin-note">تنويه: هذا التركيز ناتج عن إضافة 1 مل دواء إلى 49 مل محلول.</div>
        </div>
    </div>

    <button class="btn" onclick="calculateDose()">احسب الجرعة والتحضير</button>

    <div class="result-box" id="resultBox">
        <div id="resultContent"></div>
    </div>
</div>

<script>
    // حساب PMA
    function calculatePMA() {
        const ga = parseFloat(document.getElementById('ga').value) || 0;
        const pna = parseFloat(document.getElementById('pna').value) || 0;
        if (ga > 0) {
            document.getElementById('pma').value = (ga + (pna / 7)).toFixed(1);
        } else {
            document.getElementById('pma').value = '';
        }
    }

    // قاعدة بيانات الأدوية المحدثة
    const drugsData = {
        unasyn: { isStandard: true, stdMg: 500, stdMl: 16, baseDose: 50, meningitisDose: 100, interval: "كل 12-8 ساعات حسب العمر", note: "Dose based on Ampicillin component." }, 
        meronem: { isStandard: true, stdMg: 500, stdMl: 25, baseDose: 20, meningitisDose: 40, interval: "كل 12-8 ساعات حسب العمر", note: "Infuse over 30 mins." },
        amikin: { isStandard: true, stdMg: 250, stdMl: 50, baseDose: 15, meningitisDose: 20, maxConc: 5, note: "Infuse over 30 mins." },
        vancomycin: { isStandard: true, stdMg: 500, stdMl: 10, baseDose: 15, meningitisDose: 15, maxConc: 5, note: "Infuse over 60 mins. Monitor trough levels." },
        caffeine: { isStandard: false, baseDose: 10, meningitisDose: 10, maxConc: 10, interval: "كل 24 ساعة", note: "Maintenance dose." },
        calcium: { isStandard: false, baseDose: 100, meningitisDose: 100, maxConc: 50, interval: "كل 6-8 ساعات", note: "Max peripheral conc: 50mg/ml." },
        fluconazole: { isStandard: false, baseDose: 12, meningitisDose: 12, maxConc: 2, interval: "كل 72-24 ساعة حسب العمر", note: "Flash IV." }
    };

    // تحديث الخانات عند تغيير الدواء أو تحميل الصفحة
    function updateVialInputs() {
        const drugKey = document.getElementById('drug').value;
        const drugInfo = drugsData[drugKey];
        
        const vialMgInput = document.getElementById('vial_mg');
        const vialMlInput = document.getElementById('vial_ml');
        const badges = document.querySelectorAll('.std-badge');
        const amikinNote = document.getElementById('amikinNote');

        if (drugInfo.isStandard) {
            vialMgInput.value = drugInfo.stdMg;
            vialMlInput.value = drugInfo.stdMl;
            vialMgInput.readOnly = true;
            vialMlInput.readOnly = true;
            badges.forEach(b => b.style.display = 'inline-block');
            
            // إظهار ملاحظة الأميكين فقط لو تم اختياره
            amikinNote.style.display = (drugKey === 'amikin') ? 'block' : 'none';
        } else {
            vialMgInput.value = '';
            vialMlInput.value = '';
            vialMgInput.readOnly = false;
            vialMlInput.readOnly = false;
            badges.forEach(b => b.style.display = 'none');
            amikinNote.style.display = 'none';
        }
    }

    // تشغيل الدالة فور تحميل الصفحة لضبط الدواء الافتراضي
    window.onload = updateVialInputs;

    // دالة الحساب الرئيسية
    function calculateDose() {
        const drugKey = document.getElementById('drug').value;
        const weight = parseFloat(document.getElementById('weight').value);
        const vialMg = parseFloat(document.getElementById('vial_mg').value);
        const vialMl = parseFloat(document.getElementById('vial_ml').value);
        const pma = parseFloat(document.getElementById('pma').value) || 0;
        const pna = parseFloat(document.getElementById('pna').value) || 0;
        const isMeningitis = document.getElementById('meningitisToggle').checked;

        if (!weight || !vialMg || !vialMl) {
            alert("برجاء إدخال الوزن وتأكيد بيانات الفايل.");
            return;
        }

        const drugInfo = drugsData[drugKey];
        const drugName = document.getElementById('drug').options[document.getElementById('drug').selectedIndex].text;
        
        let dosePerKg = isMeningitis ? drugInfo.meningitisDose : drugInfo.baseDose;
        let interval = drugInfo.interval || "حسب البروتوكول";
        let maxConc = drugInfo.maxConc || 5; 
        
        // منطق Interval خاص بـ Vancomycin و Amikacin (كما في الكود السابق)
        if (drugKey === 'vancomycin') {
            if (!pma) { alert("أدخل الأعمار لـ Vancomycin."); return; }
            if (pma < 29) interval = "كل 24 ساعة";
            else if (pma <= 36) interval = "كل 12 ساعة";
            else if (pma <= 44) interval = "كل 8 ساعات";
            else interval = "كل 6 ساعات";
        } else if (drugKey === 'amikin') {
            if (!pma) { alert("أدخل الأعمار لـ Amikin."); return; }
            if (pma < 30) interval = "كل 48 ساعة";
            else if (pma <= 34) interval = (pna <= 7) ? "كل 36 ساعة" : "كل 24 ساعة";
            else interval = (pna <= 7) ? "كل 24 ساعة" : "كل 12-24 ساعة";
        }

        // الحسابات
        const requiredDoseMg = weight * dosePerKg;
        const volumeToDraw = (requiredDoseMg / vialMg) * vialMl;

        // توليد نص النتيجة بناءً على نوع الدواء
        let stepsHTML = "";

        if (drugInfo.isStandard) {
            if (drugKey === 'vancomycin') {
                // استثناء الفانكومايسين
                let totalVolumeNeeded = requiredDoseMg / maxConc;
                let diluentToAdd = totalVolumeNeeded > volumeToDraw ? totalVolumeNeeded - volumeToDraw : 0;
                
                stepsHTML = `
                    1. <strong>التحضير الأولي:</strong> قم بحل فايل (${drugInfo.stdMg} mg) في (${drugInfo.stdMl} ml).<br>
                    2. <strong>جرعة الطفل:</strong> اسحب <span class="highlight">(${volumeToDraw.toFixed(2)} ml)</span> من المحلول.<br>
                    3. <span class="highlight">تنبيه إكلينيكي هام:</span> يجب تخفيف الجرعة المسحوبة في سرنجة أخرى بإضافة <span class="highlight">(${diluentToAdd.toFixed(2)} ml)</span> من المحلول المتوافق لتصل لتركيز أقصاه (5 mg/ml) قبل الإعطاء الوريدي لتجنب التهاب الوريد.
                `;
            } else {
                // باقي الأدوية القياسية
                stepsHTML = `
                    1. <strong>التحضير القياسي:</strong> قم بحل الفايل لتصل للتركيز المعتمد في البروتوكول (${drugInfo.stdMg}mg / ${drugInfo.stdMl}ml).<br>
                    2. <strong>جرعة الطفل:</strong> اسحب <span class="success-text">(${volumeToDraw.toFixed(2)} ml)</span> من المحلول السابق، <span class="success-text">وهي جاهزة للحقن مباشرة.</span>
                `;
            }
        } else {
            // الأدوية ذات الإدخال اليدوي
            let totalVolumeNeeded = requiredDoseMg / maxConc;
            let diluentToAdd = totalVolumeNeeded > volumeToDraw ? totalVolumeNeeded - volumeToDraw : 0;

            if (diluentToAdd > 0) {
                stepsHTML = `
                    1. اسحب <span class="highlight">(${volumeToDraw.toFixed(2)} ml)</span> من الفايل المتاح.<br>
                    2. أضف عليها <span class="highlight">(${diluentToAdd.toFixed(2)} ml)</span> تخفيف إضافي.<br>
                    3. الحجم النهائي للإعطاء: <span class="highlight">(${totalVolumeNeeded.toFixed(2)} ml)</span>.
                `;
            } else {
                stepsHTML = `
                    1. اسحب <span class="success-text">(${volumeToDraw.toFixed(2)} ml)</span> من الفايل المتاح.<br>
                    2. <span class="success-text">الجرعة جاهزة للحقن مباشرة</span> (لا تحتاج تخفيف إضافي لأن تركيزها آمن).
                `;
            }
        }

        const resultHTML = `
            <strong>الدواء:</strong> ${drugName} ${isMeningitis ? '<span class="highlight">(Meningitis Dose)</span>' : ''}<br>
            <strong>الجرعة المطلوبة:</strong> <span class="highlight">${requiredDoseMg.toFixed(2)} mg</span> (${dosePerKg} mg/kg) <br>
            <strong>التكرار:</strong> <span style="color:var(--success-color); font-weight:bold;">${interval}</span> <br>
            <strong>خطوات التحضير بدقة:</strong><br>
            <div style="background: white; padding: 10px; border-radius: 5px; margin-top: 5px; border-right: 3px solid #ccc;">
                ${stepsHTML}
            </div>
            <hr style="border:0; border-top:1px solid #ccc; margin: 10px 0;">
            <small><strong>ملاحظة إكلينيكية:</strong> ${drugInfo.note}</small>
        `;

        document.getElementById('resultContent').innerHTML = resultHTML;
        document.getElementById('resultBox').style.display = 'block';
    }
</script>

</body>
</html>
