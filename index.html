<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced NICU Dose Calculator</title>
    <style>
        :root {
            --primary-color: #005b96;
            --secondary-color: #b3cde0;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --accent-color: #e67e22;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 10px;
            margin-top: 0;
        }
        .row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group {
            flex: 1;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--primary-color);
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        input[readonly] {
            background-color: #e9ecef;
            color: var(--accent-color);
            font-weight: bold;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #03396c;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f4f8;
            border-right: 5px solid var(--primary-color);
            border-radius: 6px;
            display: none;
            line-height: 1.8;
        }
        .highlight {
            font-weight: bold;
            color: #d9534f;
        }
        .info-badge {
            background-color: #27ae60;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>حاسبة أدوية العناية المركزة لحديثي الولادة</h2>
    
    <div class="row">
        <div class="form-group">
            <label for="ga">Gestational Age (weeks):</label>
            <input type="number" id="ga" min="22" max="42" placeholder="مثال: 30" oninput="calculatePMA()">
        </div>
        
        <div class="form-group">
            <label for="pna">Postnatal Age (days):</label>
            <input type="number" id="pna" min="0" max="90" placeholder="مثال: 10" oninput="calculatePMA()">
        </div>

        <div class="form-group">
            <label for="pma">Calculated PMA (weeks):</label>
            <input type="text" id="pma" readonly placeholder="سيحسب تلقائياً">
        </div>
    </div>

    <div class="row">
        <div class="form-group">
            <label for="weight">وزن الطفل (كجم):</label>
            <input type="number" id="weight" step="0.01" placeholder="مثال: 1.5">
        </div>

        <div class="form-group">
            <label for="drug">اختر الدواء:</label>
            <select id="drug">
                <option value="vancomycin">Vancomycin</option>
                <option value="amikin">Amikin (Amikacin)</option>
                <option value="unasyn">Unasyn (Ampicillin/Sulbactam)</option>
                <option value="meronem">Meronem (Meropenem)</option>
                <option value="caffeine">Caffeine Citrate</option>
                <option value="calcium">Calcium Gluconate 10%</option>
                <option value="fluconazole">Fluconazole</option>
            </select>
        </div>
    </div>

    <div class="row">
        <div class="form-group">
            <label for="vial_mg">تركيز الفايل المتاح (mg):</label>
            <input type="number" id="vial_mg" placeholder="مثال: 500">
        </div>

        <div class="form-group">
            <label for="vial_ml">حجم الفايل المتاح (ml):</label>
            <input type="number" id="vial_ml" step="0.1" placeholder="مثال: 5 أو حجم الحل">
        </div>
    </div>

    <button class="btn" onclick="calculateDose()">احسب الجرعة والتحضير الدقيق</button>

    <div class="result-box" id="resultBox">
        <div id="resultContent"></div>
    </div>
</div>

<script>
    // الدالة المسؤولة عن الحساب التلقائي للـ PMA فور إدخال الـ GA والـ PNA
    function calculatePMA() {
        const ga = parseFloat(document.getElementById('ga').value) || 0;
        const pna = parseFloat(document.getElementById('pna').value) || 0;
        
        if (ga > 0) {
            const pma = ga + (pna / 7);
            document.getElementById('pma').value = pma.toFixed(1);
        } else {
            document.getElementById('pma').value = '';
        }
    }

    // قاعدة البيانات الثابتة للأدوية (القيم الافتراضية)
    const defaultDrugsData = {
        unasyn: { dosePerKg: 50, maxConc: 50, interval: "كل 12 ساعة (تتغير حسب العمر والوزن)", note: "Dose based on Ampicillin. Dilute with NS." }, 
        meronem: { dosePerKg: 20, maxConc: 50, interval: "كل 12 ساعة", note: "For meningitis, dose is 40 mg/kg." },
        caffeine: { dosePerKg: 10, maxConc: 10, interval: "كل 24 ساعة", note: "Maintenance dose. Loading is 20 mg/kg." },
        calcium: { dosePerKg: 100, maxConc: 50, interval: "كل 6-8 ساعات أو مستمر", note: "Max peripheral conc: 50mg/ml. Infuse slowly!" },
        fluconazole: { dosePerKg: 12, maxConc: 2, interval: "كل 72-24 ساعة حسب العمر", note: "Flash IV over 30 mins." }
    };

    function calculateDose() {
        const drugKey = document.getElementById('drug').value;
        const weight = parseFloat(document.getElementById('weight').value);
        const vialMg = parseFloat(document.getElementById('vial_mg').value);
        const vialMl = parseFloat(document.getElementById('vial_ml').value);
        const ga = parseFloat(document.getElementById('ga').value) || 0;
        const pna = parseFloat(document.getElementById('pna').value) || 0;
        const pma = parseFloat(document.getElementById('pma').value) || 0;

        if (!weight || !vialMg || !vialMl) {
            alert("برجاء إدخال الوزن وتفاصيل الفايل المتاح أولاً.");
            return;
        }

        let dosePerKg = 0;
        let interval = "";
        let maxConc = 5; // الافتراضي للتخفيف الآمن
        let note = "";
        const drugName = document.getElementById('drug').options[document.getElementById('drug').selectedIndex].text;

        // منطق حساب جرعات الـ Vancomycin بناءً على الـ PMA (تبعاً للمراجع القياسية مثل Neofax)
        if (drugKey === 'vancomycin') {
            maxConc = 5; // 5 mg/ml
            dosePerKg = 15; // الجرعة القياسية ثابتة غالباً والتحكم في الـ Interval
            note = "Infuse over 60 mins. Monitor trough levels before the 4th dose.";
            
            if (!pma) {
                alert("برجاء إدخال Gestational Age و Postnatal Age لحساب جرعة الـ Vancomycin بدقة.");
                return;
            }

            if (pma < 29) {
                interval = "كل 24 ساعة";
            } else if (pma >= 29 && pma <= 36) {
                interval = "كل 12 ساعة";
            } else if (pma >= 37 && pma <= 44) {
                interval = "كل 8 ساعات";
            } else {
                interval = "كل 6 ساعات";
            }
        } 
        // منطق حساب جرعات الـ Amikin بناءً على الـ PMA والـ PNA
        else if (drugKey === 'amikin') {
            maxConc = 5; // 5 mg/ml
            note = "Infuse over 30 mins. Check peak and trough if indicated.";
            
            if (!pma) {
                alert("برجاء إدخال الأعمار لحساب جرعة الـ Amikin بدقة.");
                return;
            }

            if (pma < 30) {
                dosePerKg = 15;
                interval = "كل 48 ساعة";
            } else if (pma >= 30 && pma <= 34) {
                if (pna <= 7) {
                    dosePerKg = 15; interval = "كل 36 ساعة";
                } else {
                    dosePerKg = 15; interval = "كل 24 ساعة";
                }
            } else { // PMA >= 35
                if (pna <= 7) {
                    dosePerKg = 15; interval = "كل 24 ساعة";
                } else {
                    dosePerKg = 15; interval = "كل 12-24 ساعة";
                }
            }
        } 
        // الأدوية الأخرى تستدعي البيانات الافتراضية (يمكنك التوسع فيها بنفس الطريقة لاحقاً)
        else {
            const drugInfo = defaultDrugsData[drugKey];
            dosePerKg = drugInfo.dosePerKg;
            maxConc = drugInfo.maxConc;
            interval = drugInfo.interval;
            note = drugInfo.note;
        }

        // العمليات الحسابية الرياضية
        const requiredDoseMg = weight * dosePerKg;
        const volumeToDraw = (requiredDoseMg / vialMg) * vialMl;
        
        let totalVolumeNeeded = requiredDoseMg / maxConc;
        if (totalVolumeNeeded < volumeToDraw) {
            totalVolumeNeeded = volumeToDraw;
        }
        const diluentToAdd = totalVolumeNeeded - volumeToDraw;

        // طباعة النتيجة للمستخدم المعالج
        const resultHTML = `
            <strong>الدواء:</strong> ${drugName} <br>
            <strong>الجرعة الفردية المحسوبة:</strong> <span class="highlight">${requiredDoseMg.toFixed(2)} mg</span> (${dosePerKg} mg/kg) <br>
            <strong>التكرار (Interval):</strong> <span class="highlight" style="color:#27ae60;">${interval}</span> <br>
            <strong>خطوات التحضير بدقة:</strong><br>
            1. اسحب <span class="highlight">${volumeToDraw.toFixed(2)} ml</span> من الفايل المتاح.<br>
            2. أضف عليها <span class="highlight">${diluentToAdd > 0 ? diluentToAdd.toFixed(2) : "0"} ml</span> من المحلول المتوافق لتصل للتركيز الآمن.<br>
            3. الحجم النهائي الإجمالي للحقن هو: <span class="highlight">${totalVolumeNeeded.toFixed(2)} ml</span>.<br>
            <hr style="border:0; border-top:1px solid #ccc; margin: 10px 0;">
            <small><strong>تنبيه إكلينيكي:</strong> ${note}</small>
        `;

        document.getElementById('resultContent').innerHTML = resultHTML;
        document.getElementById('resultBox').style.display = 'block';
    }
</script>

</body>
</html>
